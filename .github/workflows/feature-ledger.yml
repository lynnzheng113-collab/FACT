name: Feature ledger consistency
on:
  push:
  pull_request:
jobs:
  ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check feature ledger and source baseline
        run: node scripts/feature-ledger.mjs check
