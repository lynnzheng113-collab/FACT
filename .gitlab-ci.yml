pages:
  script:
    # dist is built and verified locally before it is pushed.
    - rm -rf public
    - mkdir -p public
    - cp -r dist/. public/
  artifacts:
    paths:
      - public/
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - mkdir public
    - cp -r dist/. public/
  dependencies:
    - build
  artifacts:
    paths:
      - public/
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
